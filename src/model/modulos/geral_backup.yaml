    tabela: GEBACKUP_NUVEM_DADOS_ENVIO
    chave: [SEQUENCIAL]
    acesso: {empresa: null, volume: medio}
    ordem:
    - [SEQUENCIAL, asc]
    colunas: {sequencial_auto_incremento: SEQUENCIAL, tipo_do_dado_a_ser_enviado: TIPO_DADO, c_1_inclusao_2_exclusao: ACAO, valor_da_chave_primaria_do_dado_a_ser_en: VALOR_CHAVE_PRIMARIA,
