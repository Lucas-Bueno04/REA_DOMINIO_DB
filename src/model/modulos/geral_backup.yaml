        liga: {tipo_dado: codigo}
        colunas: {gebackup_nuvem_tipo_dado_nome: NOME_TABELA_CORRESPONDENTE}
    filtros:
      sequencial_auto_incremento:
        coluna: SEQUENCIAL
        ops: [eq, in]
      tipo_do_dado_a_ser_enviado:
        coluna: TIPO_DADO
        ops: [eq, in]
