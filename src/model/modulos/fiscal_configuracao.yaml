# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: fiscal_configuracao
titulo: Fiscal - configuracao (rascunho em lote)
dominios:
  efconfiguracao_produto_por_ncm_vigencia_itens_pro_tipo_de_con:
    confirmado: true
    nota: 'Todos os valores observados em EFCONFIGURACAO_PRODUTO_POR_NCM_VIGENCIA_ITENS_PRO.TIPO_CONTRIBUICAO estão no comentário do banco (2026-10-18). Distribuição:
      C=1.'
    valores: {N: Não cumulativo, C: Cumulativo, T: Subt. Tributária, S: Sem incidência}
entidades:
  efconfiguracao_produto_por_ncm:
    titulo: Configurar Dados de Impostos por NCM
    descricao: 'Configurar Dados de Impostos por NCM. 1 linhas no catálogo; chave: CODI_EMP, I_CONFIGURACAO_NCM.'
    tabela: EFCONFIGURACAO_PRODUTO_POR_NCM
    chave: [CODI_EMP, I_CONFIGURACAO_NCM]
    acesso: {empresa: CODI_EMP, volume: pequeno}
    ordem:
    - [I_CONFIGURACAO_NCM, asc]
    colunas: {codigo_da_empresa: CODI_EMP, codigo_da_configuracao_de_produto_por_nc: I_CONFIGURACAO_NCM}
    vinculos:
      geempre:
        tabela: geempre
        liga: {codi_emp: codi_emp}
        colunas: {geempre_nome: nome_emp}
    filtros:
      codigo_da_configuracao_de_produto_por_nc:
        coluna: I_CONFIGURACAO_NCM
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 1 linhas, 1 empresa(s).', 'Vínculo geempre (geempre): 0 de 1 linhas sem registro relacionado (empresa 234).']
  efconfiguracao_produto_por_ncm_vigencia:
    titulo: Configuração de Impostos para Produtos - Vigência
    descricao: 'Configuração de Impostos para Produtos - Vigência. 1 linhas no catálogo; chave: CODI_EMP, I_CONFIGURACAO_NCM, DATA_VIGENCIA.'
    tabela: EFCONFIGURACAO_PRODUTO_POR_NCM_VIGENCIA
    chave: [CODI_EMP, I_CONFIGURACAO_NCM, DATA_VIGENCIA]
    acesso: {empresa: CODI_EMP, periodo: DATA_VIGENCIA, volume: pequeno}
    ordem:
    - [DATA_VIGENCIA, desc]
    - [I_CONFIGURACAO_NCM, asc]
    colunas: {codigo_da_empresa: CODI_EMP, codigo_da_configuracao_de_produto_por_nc: I_CONFIGURACAO_NCM, vigencia: DATA_VIGENCIA, descricao: DESCRICAO}
    filtros:
      codigo_da_configuracao_de_produto_por_nc:
        coluna: I_CONFIGURACAO_NCM
        ops: [eq, in]
      vigencia:
        coluna: DATA_VIGENCIA
        ops: [eq, in]
      descricao:
        coluna: DESCRICAO
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 1 linhas, 1 empresa(s), DATA_VIGENCIA de 2017-07-01 a 2017-07-01.']
