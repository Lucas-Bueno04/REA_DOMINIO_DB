    descricao: 'Classe do Servico. 782 linhas no catálogo; chave: codigo_receita, codigo_classe.'
    tabela: rgtabela_classe_servico
    chave: [codigo_receita, codigo_classe]
    acesso: {empresa: null, volume: pequeno}
    ordem:
    - [codigo_receita, asc]
    - [codigo_classe, asc]
    colunas: {codigo_da_receita: codigo_receita, codigo_da_classe_do_servico: codigo_classe, descricao: descricao}
    vinculos:
      rgtabela_codigo_receita:
        tabela: rgtabela_codigo_receita
        liga: {codigo_receita: codigo_receita}
        colunas: {rgtabela_codigo_receita_nome: descricao}
    filtros:
      codigo_da_receita:
        coluna: codigo_receita
        ops: [eq, in]
      codigo_da_classe_do_servico:
        coluna: codigo_classe
        ops: [eq, in]
      descricao:
        coluna: descricao
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 782 linhas.', 'Vínculo rgtabela_codigo_receita (rgtabela_codigo_receita): 0 de 782 linhas sem registro relacionado.']
