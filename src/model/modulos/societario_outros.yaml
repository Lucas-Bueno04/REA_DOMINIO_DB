# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: societario_outros
titulo: Societário - outros (rascunho em lote)
dominios:
  rgtipo_alteracao_contratual_tipo_da_alteracao_da_:
    confirmado: true
    nota: 'Todos os valores observados em rgtipo_alteracao_contratual.tipofilial estão no comentário do banco (2026-10-18). Distribuição: A=6.'
    valores: {I: Inclusao, E: Exclusao, A: Alteracao Cadastral}
  rgalteracao_contratual_situacao_da_natureza_juridica:
    confirmado: true
    nota: 'Todos os valores observados em rgalteracao_contratual.SITUACAO_NATUREZA_JURIDICA estão no comentário do banco (2026-10-18). Distribuição: S=1.'
