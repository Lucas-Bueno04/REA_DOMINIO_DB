# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: processos_atividade
titulo: Processos - atividade (rascunho em lote)
entidades:
  pcatividade_modulo_menu_submenu_uf_opcao:
    titulo: Módulos - Menu - Submenu - UF - Opção
    descricao: 'Módulos - Menu - Submenu - UF - Opção. 850 linhas no catálogo; chave: I_OPCAO.'
    tabela: PCATIVIDADE_MODULO_MENU_SUBMENU_UF_OPCAO
    chave: [I_OPCAO]
    acesso: {empresa: null, volume: pequeno}
    ordem:
    - [I_OPCAO, asc]
    colunas: {codigo: I_OPCAO, modulo: I_MODULO, menu: I_MENU, submenu: I_SUBMENU, i_uf: I_UF, nome: NOME, ordem: ORDEM, a_opcao_representa_um_imposto_s_n: CONFORME_IMPOSTO,
      codigo_do_imposto_no_sistema: CODIGO_IMPOSTO, inativo_s_n: INATIVO}
    vinculos:
      pcatividade_modulo:
        tabela: PCATIVIDADE_MODULO
        liga: {i_modulo: i_modulo}
        colunas: {pcatividade_modulo_nome: NOME}
      pcatividade_modulo_menu:
        tabela: PCATIVIDADE_MODULO_MENU_SUBMENU_UF
        liga: {i_uf: i_uf}
        colunas: {pcatividade_modulo_menu_nome: NOME}
    filtros:
      codigo:
        coluna: I_OPCAO
        ops: [eq, in]
      modulo:
        coluna: I_MODULO
        ops: [eq, in]
      menu:
        coluna: I_MENU
        ops: [eq, in]
      submenu:
        coluna: I_SUBMENU
        ops: [eq, in]
      i_uf:
        coluna: I_UF
        ops: [eq, in]
      nome:
        coluna: NOME
        ops: [contem, prefixo]
      a_opcao_representa_um_imposto_s_n:
        coluna: CONFORME_IMPOSTO
        ops: [eq, in]
      codigo_do_imposto_no_sistema:
        coluna: CODIGO_IMPOSTO
        ops: [eq, in]
      inativo_s_n:
        coluna: INATIVO
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 850 linhas.', 'Vínculo pcatividade_modulo (PCATIVIDADE_MODULO): 0 de 850 linhas sem registro relacionado.', 'Vínculo pcatividade_modulo_menu
        (PCATIVIDADE_MODULO_MENU_SUBMENU_UF): 0 de 850 linhas sem registro relacionado.']
  pcatividade_modulo_menu_submenu:
    titulo: Módulos - Menu - Submenu
    descricao: 'Módulos - Menu - Submenu. 62 linhas no catálogo; chave: I_SUBMENU.'
    tabela: PCATIVIDADE_MODULO_MENU_SUBMENU
    chave: [I_SUBMENU]
    acesso: {empresa: null, volume: pequeno}
