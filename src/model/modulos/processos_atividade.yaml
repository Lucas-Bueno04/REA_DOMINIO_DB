        0 de 26 linhas sem registro relacionado.']
  pcatividade_modulo_menu:
    titulo: Módulos - Menu
    descricao: 'Módulos - Menu. 12 linhas no catálogo; chave: I_MENU.'
    tabela: PCATIVIDADE_MODULO_MENU
    chave: [I_MENU]
    acesso: {empresa: null, volume: pequeno}
    ordem:
