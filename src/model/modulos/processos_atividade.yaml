    - [I_SUBMENU, asc]
    colunas: {codigo: I_SUBMENU, modulo: I_MODULO, menu: I_MENU, nome: NOME, conforme_uf_s_n: CONFORME_UF, ordem: ORDEM}
    vinculos:
      pcatividade_modulo:
        tabela: PCATIVIDADE_MODULO
        liga: {i_modulo: i_modulo}
        colunas: {pcatividade_modulo_nome: NOME}
      pcatividade_modulo_menu:
        tabela: PCATIVIDADE_MODULO_MENU
        liga: {i_menu: i_menu}
        colunas: {pcatividade_modulo_menu_nome: NOME}
    filtros:
      codigo:
        coluna: I_SUBMENU
        ops: [eq, in]
      modulo:
        coluna: I_MODULO
        ops: [eq, in]
      menu:
        coluna: I_MENU
        ops: [eq, in]
      nome:
        coluna: NOME
        ops: [contem, prefixo]
      conforme_uf_s_n:
        coluna: CONFORME_UF
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 62 linhas.', 'Vínculo pcatividade_modulo (PCATIVIDADE_MODULO): 0 de 62 linhas sem registro relacionado.', 'Vínculo pcatividade_modulo_menu
        (PCATIVIDADE_MODULO_MENU): 0 de 62 linhas sem registro relacionado.']
  pcatividade_modulo_menu_submenu_uf:
    titulo: Módulos - Menu - Submenu - UF
    descricao: 'Módulos - Menu - Submenu - UF. 27 linhas no catálogo; chave: I_UF.'
    tabela: PCATIVIDADE_MODULO_MENU_SUBMENU_UF
    chave: [I_UF]
