# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: fiscal_parametro
titulo: Fiscal - parametro (rascunho em lote)
dominios: {}
entidades:
  efparametro_vigencia_aproveita_credito:
    titulo: Parametros - Cadastro - Escrita Fiscal - Aproveitamento Crédito
    descricao: 'Parametros - Cadastro - Escrita Fiscal - Aproveitamento Crédito. 103.824 linhas no catálogo; chave: CODI_EMP, VIGENCIA_PAR, CODIGO_CREDITO.'
    tabela: EFPARAMETRO_VIGENCIA_APROVEITA_CREDITO
    chave: [CODI_EMP, VIGENCIA_PAR, CODIGO_CREDITO]
    acesso: {empresa: CODI_EMP, periodo: VIGENCIA_PAR, volume: medio}
    ordem:
    - [VIGENCIA_PAR, desc]
    - [CODIGO_CREDITO, asc]
    colunas: {empresa: CODI_EMP, vigencia: VIGENCIA_PAR, codigo_do_credito: CODIGO_CREDITO, ordem_de_aproveitamento: ORDEM}
    filtros:
      vigencia:
        coluna: VIGENCIA_PAR
        ops: [eq, in]
      codigo_do_credito:
        coluna: CODIGO_CREDITO
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 103.824 linhas, 896 empresa(s), VIGENCIA_PAR de 1964-06-01 a 2026-09-01.']
  efparametro_vigencia_inscricoes_subtri:
    titulo: Paramentros - Inscricoes de Substituicao Tributaria
    descricao: 'Paramentros - Inscricoes de Substituicao Tributaria. 16 linhas no catálogo; chave: CODI_EMP, SIGL_EST, VIGENCIA_PAR.'
    tabela: EFPARAMETRO_VIGENCIA_INSCRICOES_SUBTRI
    chave: [CODI_EMP, SIGL_EST, VIGENCIA_PAR]
    acesso: {empresa: CODI_EMP, periodo: VIGENCIA_PAR, volume: pequeno}
    ordem:
    - [VIGENCIA_PAR, desc]
    - [SIGL_EST, asc]
    colunas:
      empresa: CODI_EMP
      sigla_do_estado_uf: SIGL_EST
      vigencia: VIGENCIA_PAR
      inscricao_estadual: {coluna: IEST_INF, sensivel: parcial}
      preco_medio_ponderado_fiscal: PMPF_INF
      origem_do_registro_0_sistema_1_imp_tabel: ORIGEM_REG
    filtros:
      sigla_do_estado_uf:
        coluna: SIGL_EST
        ops: [eq, in]
      vigencia:
        coluna: VIGENCIA_PAR
        ops: [eq, in]
      inscricao_estadual:
        coluna: IEST_INF
        ops: [contem, prefixo]
      preco_medio_ponderado_fiscal:
        coluna: PMPF_INF
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 16 linhas, 4 empresa(s), VIGENCIA_PAR de 2026-01-01 a 2026-05-01.']
