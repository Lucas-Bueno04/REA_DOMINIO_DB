      indica_que_a_acao_foi_enviada_com_metodo: ATUALIZAR_REGISTRO}
    vinculos:
      geatendimentotabelastran:
        tabela: GEATENDIMENTOTABELASTRANSFERIR
        liga: {codigo_tabela: codigo}
        colunas: {geatendimentotabelastran_nome: NOME_XML}
    filtros:
      sequencial_autoincremento:
        coluna: CODIGO
        ops: [eq, in]
      codigo_da_tabela:
        coluna: CODIGO_TABELA
        ops: [eq, in]
      clausula_com_argumentos_para_geracao_de:
        coluna: CLAUSULA
        ops: [contem, prefixo]
      endpoint_referencial_do_registro_no_onvi:
        coluna: ENDPOINT_EXCLUSAO
        ops: [contem, prefixo]
      coluna_que_indica_o_codigo_referente_a_f:
        coluna: I_FILIAL
        ops: [eq, in]
      codigo_do_usuario_utilizado_para_realiza:
        coluna: I_CONFUSUARIO
        ops: [eq, in]
      endpoint_para_consulta_de_envio_assincro:
        coluna: OPERATION_LOCATION
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 1.082.429 linhas, 1.864 empresa(s).', 'Vínculo geatendimentotabelastran (GEATENDIMENTOTABELASTRANSFERIR): 0 de 29 linhas sem registro
