    descricao: 'Ações à serem enviadas para o Onvio.. 1.081.410 linhas no catálogo; chave: CODIGO.'
    tabela: GEATENDIMENTOACOES_ONVIO
    chave: [CODIGO]
    acesso:
      empresa: CODI_EMP
      exige_algum: [sequencial_autoincremento]
      volume: grande
    ordem:
    - [CODIGO, asc]
    colunas: {sequencial_autoincremento: CODIGO, codigo_da_tabela: CODIGO_TABELA, acao: ACAO, clausula_com_argumentos_para_geracao_de: CLAUSULA, tipos_de_status_3_ignorado_2_aguardando: STATUS,
