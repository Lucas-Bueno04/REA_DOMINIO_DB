    - [I_CREDITO_PRESUMIDO, asc]
    colunas: {empresa: CODI_EMP, sequencial: I_CREDITO_PRESUMIDO, codigo_interno_do_credito_presumido: CODIGO_TABELA, descricao: DESCRICAO}
    vinculos:
      geempre:
        tabela: geempre
        liga: {codi_emp: codi_emp}
        colunas: {geempre_nome: nome_emp}
    filtros:
      sequencial:
        coluna: I_CREDITO_PRESUMIDO
        ops: [eq, in]
      codigo_interno_do_credito_presumido:
        coluna: CODIGO_TABELA
        ops: [eq, in]
      descricao:
        coluna: DESCRICAO
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 632 linhas, 632 empresa(s).', 'Vínculo geempre (geempre): 0 de 1 linhas sem registro relacionado (empresa 884).']
