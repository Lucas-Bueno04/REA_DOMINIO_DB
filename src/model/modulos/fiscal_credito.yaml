# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: fiscal_credito
titulo: Fiscal - credito (rascunho em lote)
entidades:
  efcredito_presumido_piscofins_receitas_vigencia_detalhamento:
    titulo: Tabela de Crédito Presumido PIS e COFINS sobre as Receitas - Relação de NCM
    descricao: 'Tabela de Crédito Presumido PIS e COFINS sobre as Receitas - Relação de NCM. 4.424 linhas no catálogo; chave: CODI_EMP, I_CREDITO_PRESUMIDO, VIGENCIA,
      I_CREDITO_PRESUMIDO_DETALHAMENTO.'
    tabela: EFCREDITO_PRESUMIDO_PISCOFINS_RECEITAS_VIGENCIA_DETALHAMENTO
    chave: [CODI_EMP, I_CREDITO_PRESUMIDO, VIGENCIA, I_CREDITO_PRESUMIDO_DETALHAMENTO]
    acesso: {empresa: CODI_EMP, periodo: VIGENCIA, volume: pequeno}
    ordem:
    - [VIGENCIA, desc]
    - [I_CREDITO_PRESUMIDO, asc]
    - [I_CREDITO_PRESUMIDO_DETALHAMENTO, asc]
    colunas: {empresa: CODI_EMP, sequencial: I_CREDITO_PRESUMIDO, vigencia: VIGENCIA, sequencial_detalhamento: I_CREDITO_PRESUMIDO_DETALHAMENTO, ncm: NCM, descricao_ncm: DESCRICAO,
      percentual_credito_presumido: PERCENTUAL_CREDITO_PRESUMIDO, aliquota_pis_ajustada: ALIQUOTA_PIS_AJUSTADA, aliquota_cofins_ajustada: ALIQUOTA_COFINS_AJUSTADA,
      utilizado_como_insumo: UTILIZADO_COMO_INSUMO}
    filtros:
      sequencial:
        coluna: I_CREDITO_PRESUMIDO
        ops: [eq, in]
      vigencia:
        coluna: VIGENCIA
        ops: [eq, in]
      sequencial_detalhamento:
        coluna: I_CREDITO_PRESUMIDO_DETALHAMENTO
        ops: [eq, in]
      ncm:
        coluna: NCM
        ops: [eq, in]
      descricao_ncm:
        coluna: DESCRICAO
        ops: [contem, prefixo]
      utilizado_como_insumo:
        coluna: UTILIZADO_COMO_INSUMO
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 4.424 linhas, 632 empresa(s), VIGENCIA de 2013-10-01 a 2013-10-01.']
  efcredito_presumido_piscofins_receitas:
    titulo: Tabela de Crédito Presumido PIS e COFINS Sobre as Receitas - Geral
    descricao: 'Tabela de Crédito Presumido PIS e COFINS Sobre as Receitas - Geral. 632 linhas no catálogo; chave: CODI_EMP, I_CREDITO_PRESUMIDO.'
