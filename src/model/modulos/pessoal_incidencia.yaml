# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: pessoal_incidencia
titulo: Pessoal - incidencia (rascunho em lote)
entidades:
  foincidencia_irrf_rubrica_esocial:
    titulo: Tabela de códigos de incidência de IRRF para o eSocial.
    descricao: 'Tabela de códigos de incidência de IRRF para o eSocial.. 90 linhas no catálogo; chave: CODIGO.'
    tabela: FOINCIDENCIA_IRRF_RUBRICA_ESOCIAL
    chave: [CODIGO]
    acesso: {empresa: null, periodo: COMPETENCIA_INICIO, volume: pequeno}
    ordem:
    - [COMPETENCIA_INICIO, desc]
    - [CODIGO, asc]
    colunas: {codigo: CODIGO, descricao: DESCRICAO, competencia_inicio_para_incidencia_tribu: COMPETENCIA_INICIO, competencia_termino_para_incidencia_trib: COMPETENCIA_TERMINO}
    filtros:
      codigo:
        coluna: CODIGO
        ops: [eq, in]
      competencia_inicio_para_incidencia_tribu:
        coluna: COMPETENCIA_INICIO
        ops: [entre, gte, lte]
      competencia_termino_para_incidencia_trib:
        coluna: COMPETENCIA_TERMINO
        ops: [entre, gte, lte]
      descricao:
        coluna: DESCRICAO
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 90 linhas, COMPETENCIA_INICIO de 2015-10-01 a 2015-10-01.']
