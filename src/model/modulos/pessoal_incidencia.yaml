    - [CODIGO, asc]
    colunas: {codigo: CODIGO, descricao: DESCRICAO}
    filtros:
      codigo:
        coluna: CODIGO
        ops: [eq, in]
      descricao:
        coluna: DESCRICAO
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 28 linhas.']
