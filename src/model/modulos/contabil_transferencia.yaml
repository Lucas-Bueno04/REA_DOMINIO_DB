# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: contabil_transferencia
titulo: Contábil - transferencia (rascunho em lote)
dominios:
  pmtransferencia_conta_patrimonial_origem_da_tra:
    confirmado: true
    nota: 'Todos os valores observados em PMTRANSFERENCIA_CONTA_PATRIMONIAL.ORIGEM_TRANSFERENCIA estão no comentário do banco (2026-10-18). Distribuição: B=4.354.'
    valores: {B: Bem, T: Transferência}
  pmtransferencia_centro_custo_origem_da_trans:
    confirmado: true
    nota: 'Todos os valores observados em PMTRANSFERENCIA_CENTRO_CUSTO.ORIGEM_TRANSFERENCIA estão no comentário do banco (2026-10-18). Distribuição: B=4.354.'
    valores: {B: Bem, T: Transferência}
  pmtransferencia_matriz_filial_documento_f:
    confirmado: parcial
    nota: 'Coluna PMTRANSFERENCIA_MATRIZ_FILIAL.FISCAL_EMITENTE só tem valores nulos na data da medição (2026-10-18): sem evidência para confirmar o comentário do
      banco.'
    valores: {T: Terceiros, P: Próprio}
entidades:
  pmtransferencia_conta_patrimonial:
    titulo: Transferência de Contas Patrimoniais
    descricao: 'Transferência de Contas Patrimoniais. 4.353 linhas no catálogo; chave: CODI_EMP, I_TRANSFERENCIA.'
    tabela: PMTRANSFERENCIA_CONTA_PATRIMONIAL
    chave: [CODI_EMP, I_TRANSFERENCIA]
    acesso: {empresa: CODI_EMP, periodo: DATA_TRANSFERENCIA, volume: pequeno}
    ordem:
    - [DATA_TRANSFERENCIA, desc]
    - [I_TRANSFERENCIA, asc]
    colunas:
      empresa: CODI_EMP
      codigo: I_TRANSFERENCIA
      bem: I_BEM
      data_da_transferencia: DATA_TRANSFERENCIA
      conta_patrimonial_destino: I_CONTA_PATRIMONIAL
      codigo_do_historico: I_HISTORICO
      historico: HISTORICO
      origem_da_transferencia_b_bem_t_transfer: {coluna: ORIGEM_TRANSFERENCIA, dominio: pmtransferencia_conta_patrimonial_origem_da_tra}
      depreciacao_fiscal_acumulada: VALOR_DEPRECIACAO_FISCAL_ACUMULADA_BEM
      depreciacao_societaria_acumulada: VALOR_DEPRECIACAO_SOCIETARIA_ACUMULADA_BEM
      quantidade_de_parcelas_para_calculo_de_d: QUANTIDADE_PARCELAS_DEPRECIACAO_FISCAL
      codigo_da_transferencia_do_bem_principal: I_TRANSFERENCIA_VINCULO
    vinculos:
      pmbem:
        tabela: PMBEM
        liga: {codi_emp: codi_emp, i_bem: i_bem}
        colunas: {pmbem_nome: NOME}
      pmconta_patrimonial:
        tabela: PMCONTA_PATRIMONIAL
        liga: {codi_emp: codi_emp, i_conta_patrimonial: i_conta_patrimonial}
        colunas: {pmconta_patrimonial_nome: DESCRICAO}
      pmhistorico:
        tabela: PMHISTORICO
        liga: {codi_emp: codi_emp, i_historico: i_historico}
        colunas: {pmhistorico_nome: HISTORICO}
    filtros:
      codigo:
        coluna: I_TRANSFERENCIA
        ops: [eq, in]
      data_da_transferencia:
        coluna: DATA_TRANSFERENCIA
        ops: [entre, gte, lte]
      conta_patrimonial_destino:
        coluna: I_CONTA_PATRIMONIAL
        ops: [eq, in]
      codigo_do_historico:
        coluna: I_HISTORICO
        ops: [eq, in]
      historico:
        coluna: HISTORICO
        ops: [contem, prefixo]
      origem_da_transferencia_b_bem_t_transfer:
        coluna: ORIGEM_TRANSFERENCIA
        ops: [eq, in]
      codigo_da_transferencia_do_bem_principal:
        coluna: I_TRANSFERENCIA_VINCULO
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 4.354 linhas, 261 empresa(s), DATA_TRANSFERENCIA de 2001-09-12 a 2026-09-23.', 'Colunas expostas nulas em 100% das linhas (2):
        codigo_do_historico, codigo_da_transferencia_do_bem_principal.', 'origem_da_transferencia_b_bem_t_transfer: todos os valores reais estão no comentário do
        banco (B=4.354).', 'Vínculo pmbem (PMBEM): 0 de 4 linhas sem registro relacionado (empresa 1012).', 'Vínculo pmconta_patrimonial (PMCONTA_PATRIMONIAL): 0
        de 4 linhas sem registro relacionado (empresa 1012).', 'Vínculo pmhistorico (PMHISTORICO): 4 de 4 linhas sem registro relacionado (empresa 1012).']
