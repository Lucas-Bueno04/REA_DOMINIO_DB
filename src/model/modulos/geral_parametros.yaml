# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: geral_parametros
titulo: Geral - parametros (rascunho em lote)
entidades:
  geparametros_listagem_modelo_coluna_filtro:
    titulo: Configuração dos filtros dos relatórios gerados através do botão Listagem nos cadastros
    descricao: 'Configuração dos filtros dos relatórios gerados através do botão Listagem nos cadastros. 5.314 linhas no catálogo; chave: ID_MODELO, ID_COLUNA, ID_FILTRO,
      USUARIO, TIPO_CONDICAO, VALOR_CONDICAO, OPERADOR, AVANCADO.'
    tabela: GEPARAMETROS_LISTAGEM_MODELO_COLUNA_FILTRO
    chave: [ID_MODELO, ID_COLUNA, ID_FILTRO, USUARIO, TIPO_CONDICAO, VALOR_CONDICAO, OPERADOR, AVANCADO]
    acesso: {empresa: null, volume: pequeno}
    ordem:
    - [ID_MODELO, asc]
    colunas: {id_modelo: ID_MODELO, id_coluna: ID_COLUNA, id_filtro: ID_FILTRO, usuario: USUARIO, tipo_condicao: TIPO_CONDICAO, valor_condicao: VALOR_CONDICAO, operador: OPERADOR,
      avancado: AVANCADO}
    filtros:
      id_modelo:
        coluna: ID_MODELO
        ops: [eq, in]
      usuario:
        coluna: USUARIO
        ops: [contem, prefixo]
      tipo_condicao:
        coluna: TIPO_CONDICAO
        ops: [eq, in]
      valor_condicao:
        coluna: VALOR_CONDICAO
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 5.314 linhas.']
