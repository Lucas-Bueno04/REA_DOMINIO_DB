consultas:
  contas_a_receber:
    titulo: Contas a receber (saldo por parcela)
    descricao: >
      Por parcela de faturamento: valor faturado (Σ valor dos itens), recebido (Σ valor líquido dos recebimentos) e saldo.
      Situação: 'aberta' (saldo > 0), 'quitada' (saldo = 0) ou 'inconsistente' (saldo < 0). Validada: 42.824 quitadas, 399 abertas, 1 inconsistente.
    parametros: {escritorio: obrigatorio, vencimento_de: opcional, vencimento_ate: opcional, situacao: opcional, cliente_codigo: opcional}
