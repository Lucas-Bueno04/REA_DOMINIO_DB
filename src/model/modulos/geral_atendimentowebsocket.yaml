      empresa: null
      volume: medio
      exige_algum: [codigo_sequencial]
    ordem:
    - [CODI, asc]
    - [FILE_GUID, asc]
    colunas: {codigo_sequencial: CODI, file_guid: FILE_GUID, hasmore: HASMORE, package: PACKAGE, c_0_nao_1_sim_informa_se_a_mensagem_foi: ACAO_PROCESSADA}
