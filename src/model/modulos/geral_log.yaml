modulo: geral_log
titulo: Geral - log (rascunho em lote)
dominios:
  gelog_utilitarios_nota_tipo_da_nota_1_entrada_2:
    confirmado: true
    nota: 'Todos os valores observados em GELOG_UTILITARIOS_NOTA.TIPO_NOTA estão no comentário do banco (2026-10-18). Distribuição: 3=154.981, 2=56.668, 1=42.125.'
