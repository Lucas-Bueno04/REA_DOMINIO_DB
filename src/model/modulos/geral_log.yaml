      sequencial:
        coluna: SEQUENCIAL
        ops: [eq, in]
      tipo_da_nota_1_entrada_2_saida_3_servico:
        coluna: TIPO_NOTA
        ops: [eq, in]
      codigo_da_nota:
        coluna: CODIGO_NOTA
