        coluna: usuario
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 193 linhas.']
  auusuarios:
    titulo: Usuarios selecionados
    descricao: 'Usuarios selecionados. 169 linhas no catálogo; chave: usuario.'
    tabela: auusuarios
    chave: [usuario]
    acesso: {empresa: null, volume: pequeno}
    ordem:
