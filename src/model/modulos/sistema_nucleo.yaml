    colunas: {tabela: table_id}
    filtros:
      tabela:
        coluna: table_id
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 144 linhas.']
  aucolunasexclusao:
    titulo: Colunas gravadas na exclusao
    descricao: 'Colunas gravadas na exclusao. 107 linhas no catálogo; chave: table_id, coluna.'
    tabela: aucolunasexclusao
    chave: [table_id, coluna]
    acesso: {empresa: null, volume: pequeno}
    ordem:
    - [table_id, asc]
    - [coluna, asc]
    colunas: {tabela: table_id, nome_da_coluna: coluna}
    vinculos:
      autabelas:
        tabela: autabelas
        liga: {table_id: table_id}
        colunas: {autabelas_nome: tabela}
    filtros:
      tabela:
        coluna: table_id
        ops: [eq, in]
      nome_da_coluna:
        coluna: coluna
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 107 linhas.', 'Vínculo autabelas (autabelas): 0 de 107 linhas sem registro relacionado.']
  aucolunaslivres:
    titulo: Colunas que nao sao auditadas
    descricao: 'Colunas que nao sao auditadas. 18 linhas no catálogo; chave: table_id, coluna.'
    tabela: aucolunaslivres
    chave: [table_id, coluna]
    acesso: {empresa: null, volume: pequeno}
    ordem:
    - [table_id, asc]
    - [coluna, asc]
    colunas: {codigo_da_tabela_no_banco: table_id, nome_da_coluna: coluna}
    vinculos:
      autabelas:
        tabela: autabelas
        liga: {table_id: table_id}
        colunas: {autabelas_nome: tabela}
    filtros:
      codigo_da_tabela_no_banco:
        coluna: table_id
        ops: [eq, in]
      nome_da_coluna:
        coluna: coluna
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 18 linhas.', 'Vínculo autabelas (autabelas): 0 de 18 linhas sem registro relacionado.']
  austatus:
    titulo: Status da auditoria
    descricao: 'Status da auditoria. 1 linhas no catálogo; chave: sequencial.'
    tabela: austatus
    chave: [sequencial]
    acesso: {empresa: null, periodo: data, volume: pequeno}
    ordem:
    - [data, desc]
    - [sequencial, asc]
    colunas: {sequencial: sequencial, status_iniciado_ou_parado_i_p: status, data_atual: data, hora_atual: hora, usuario_atual: usuario}
    filtros:
      sequencial:
        coluna: sequencial
        ops: [eq, in]
      data_atual:
        coluna: data
        ops: [entre, gte, lte]
      status_iniciado_ou_parado_i_p:
        coluna: status
        ops: [eq, in]
      usuario_atual:
        coluna: usuario
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 1 linhas, data de 2018-03-07 a 2018-03-07.']
