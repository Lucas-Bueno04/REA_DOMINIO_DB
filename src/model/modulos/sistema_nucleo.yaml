    titulo: Parametros da auditoria
    descricao: 'Parametros da auditoria. 1 linhas no catálogo; chave: novas_empresas, novos_usuarios, novas_tabelas, filtro_empresa, filtro_usuario, filtro_tabela,
      EXCLUIR_DADOS_ANTERIORES_A.'
    tabela: auparametros
    chave: [novas_empresas, novos_usuarios, novas_tabelas, filtro_empresa, filtro_usuario, filtro_tabela, EXCLUIR_DADOS_ANTERIORES_A]
