      tipo: {coluna: tipo_serp, ops: [eq, in]}

  # ====================================================== APURAÇÃO ======================================================
  apuracao_imposto:
    titulo: Apuração de impostos (saldos)
    descricao: >
      Saldo/apuração de cada imposto por competência e periodicidade: totais de entradas, saídas e serviços
      (valor contábil, base, imposto, isentas, outras), créditos, débitos, estornos e saldo a recolher/credor.
    tabela: efsdoimp
    regras:
      - "Totais de entradas/saídas/serviços (…_valor_contabil) = soma de imposto_nota_*.valor_contabil do mesmo imposto no mês, pela data de movimento da nota. Conferido 6/6 competências nas três origens."
      - "Os totais de 'entradas'/'saídas'/'serviços' são por imposto: o mesmo documento pode aparecer em vários impostos. Não some entre impostos diferentes."
    chave: [codi_emp, codi_imp, data_sim, pdic_sim]
    acesso:
      empresa: codi_emp
      periodo: data_sim
      volume: medio
    ordem: [[data_sim, desc], [codi_imp, asc], [pdic_sim, asc]]
    colunas:
      imposto_codigo: {coluna: codi_imp, dominio: codigo_imposto}
      competencia: data_sim
      periodicidade: {coluna: pdic_sim, dominio: periodicidade_apuracao}
      saldo_a_recolher: sdev_sim
      saldo_credor: scre_sim
      entradas_valor_contabil: vcoe_sim
      entradas_base_calculo: bcae_sim
      entradas_valor_imposto: vime_sim
      entradas_isentas: vise_sim
      entradas_outras: voue_sim
      saidas_valor_contabil: vcos_sim
      saidas_base_calculo: bcas_sim
      saidas_valor_imposto: vims_sim
      saidas_isentas: viss_sim
      saidas_outras: vous_sim
      servicos_valor_contabil: vcov_sim
      servicos_base_calculo: bcav_sim
      servicos_valor_imposto: vimv_sim
      servicos_isentas: visv_sim
      servicos_outras: vouv_sim
      outros_creditos: outc_sim
      estorno_debitos: estd_sim
      outros_debitos: outd_sim
      estorno_creditos: estc_sim
      outras_deducoes: oded_sim
      outros_acrescimos: oacr_sim
      base_acumulada_mes_anterior: acum_sim
    vinculos:
      imposto:
        tabela: geimposto
        liga: {codi_emp: codi_emp, codi_imp: codi_imp}
        colunas: {imposto_nome: nome_imp, imposto_sigla: sigl_imp}
    filtros:
      imposto_codigo: {coluna: codi_imp, ops: [eq, in]}
      competencia: {coluna: data_sim, ops: [eq, entre, gte, lte]}
      periodicidade: {coluna: pdic_sim, ops: [eq, in]}
