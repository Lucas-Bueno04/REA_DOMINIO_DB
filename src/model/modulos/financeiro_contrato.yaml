    titulo: Contratos - Competencias para faturamento futuro
    descricao: 'Contratos - Competencias para faturamento futuro. 11.353 linhas no catálogo; chave: CODI_EMP, I_CONTRATO, MES.'
    tabela: HRCONTRATO_COMPETENCIA
    chave: [CODI_EMP, I_CONTRATO, MES]
    acesso: {empresa: CODI_EMP, volume: medio}
    ordem:
    - [I_CONTRATO, asc]
    - [MES, asc]
    colunas: {escritorio: CODI_EMP, contrato: I_CONTRATO, mes_de_faturamento: MES}
    vinculos:
      hrcontrato:
        tabela: HRCONTRATO
        liga: {codi_emp: codi_emp, i_contrato: i_contrato}
        colunas: {hrcontrato_nome: DESCRICAO}
    filtros:
      contrato:
        coluna: I_CONTRATO
        ops: [eq, in]
      mes_de_faturamento:
        coluna: MES
        ops: [eq, in]
