# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: financeiro_contrato
titulo: Financeiro do escritório - contrato (rascunho em lote)
dominios:
  hrcontrato_excedente_faturamento_execente_c_lanc:
    confirmado: true
    nota: 'Todos os valores observados em HRCONTRATO_EXCEDENTE_FATURAMENTO.EXCEDENTE estão no comentário do banco (2026-10-18). Distribuição: E=1.'
