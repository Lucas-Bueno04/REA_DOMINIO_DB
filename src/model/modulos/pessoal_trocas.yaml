    titulo: Trocas da quantidade de horas trabalhadas pelo empregado.
    descricao: 'Trocas da quantidade de horas trabalhadas pelo empregado.. 33.110 linhas no catálogo; chave: CODI_EMP, I_EMPREGADOS, DATA_TROCA, CAMPO.'
