entidades:
  fotrocas_campos:
    titulo: Trocas de ocorrencia sefip, simples nacional, categoria
    descricao: 'Trocas de ocorrencia sefip, simples nacional, categoria. 52.536 linhas no catálogo; chave: codi_emp, i_empregados, data_troca, tipo_troca.'
    tabela: fotrocas_campos
    chave: [codi_emp, i_empregados, data_troca, tipo_troca]
    acesso: {empresa: codi_emp, periodo: data_troca, volume: medio}
    ordem:
    - [data_troca, desc]
    - [i_empregados, asc]
    - [tipo_troca, asc]
    colunas:
      codigo_da_empresa: codi_emp
      codigo_do_empregado: i_empregados
      data_da_troca: data_troca
      tipo_de_troca_1_categoria_2_ocorrencia_s: {coluna: tipo_troca, dominio: fotrocas_campos_tipo_de_tro}
      nome_do_usuario_que_fez_a_troca: usuario
      controle_do_1_ativo_0_inativo: periodo_ctrl
      preriodo_inicial_do_empregado: periodo_inicio
      preriodo_final_do_empregado: periodo_fim
      valor_do_campo: valor_campo
      origem_do_registro_0_sistema_1_imp_tabel: origem_reg
      enviar_para_o_esocial_0_nao_1_sim: {coluna: ENVIAR_ESOCIAL, dominio: fotrocas_campos_enviar_para}
      gerar_retificacao_esocial: {coluna: GERAR_RETIFICACAO_ESOCIAL, dominio: fotrocas_campos_gerar_retif}
      marcacao_do_evento_para_gerar_o_evento_d: {coluna: PROCESSAR_EXCLUSAO_ESOCIAL, dominio: fotrocas_campos_marcacao_do}
    vinculos:
      foempregados:
        tabela: foempregados
        liga: {codi_emp: codi_emp, i_empregados: i_empregados}
        colunas: {foempregados_nome: nome}
    filtros:
      codigo_do_empregado:
        coluna: i_empregados
        ops: [eq, in]
      data_da_troca:
        coluna: data_troca
        ops: [eq, in]
      tipo_de_troca_1_categoria_2_ocorrencia_s:
        coluna: tipo_troca
        ops: [eq, in]
      preriodo_inicial_do_empregado:
        coluna: periodo_inicio
        ops: [entre, gte, lte]
      preriodo_final_do_empregado:
        coluna: periodo_fim
        ops: [entre, gte, lte]
      nome_do_usuario_que_fez_a_troca:
        coluna: usuario
        ops: [eq, in]
      valor_do_campo:
        coluna: valor_campo
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 52.608 linhas, 977 empresa(s), data_troca de 1968-01-29 a 2026-10-20.', 'tipo_de_troca_1_categoria_2_ocorrencia_s: todos os valores
        reais estão no comentário do banco (3=11.023, 4=11.003, 2=10.622, 1=10.392, 5=7.007, 6=2.561).', 'enviar_para_o_esocial_0_nao_1_sim: todos os valores reais
        estão no comentário do banco (1=52.608).', 'gerar_retificacao_esocial: todos os valores reais estão no comentário do banco (0=52.346, 1=262).', 'marcacao_do_evento_para_gerar_o_evento_d:
        todos os valores reais estão no comentário do banco (0=52.608).', 'Vínculo foempregados (foempregados): 0 de 10 linhas sem registro relacionado (empresa 883).']
