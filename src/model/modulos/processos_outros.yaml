# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: processos_outros
titulo: Processos - outros (rascunho em lote)
entidades:
  pcresponsavel_empresa:
    titulo: Responsáveis empresas
    descricao: 'Responsáveis empresas. 469 linhas no catálogo; chave: I_RESPONSAVEL, RESPONSAVEL_TIPO, CODI_EMP.'
    tabela: PCRESPONSAVEL_EMPRESA
    chave: [I_RESPONSAVEL, RESPONSAVEL_TIPO, CODI_EMP]
    acesso: {empresa: CODI_EMP, volume: pequeno}
    ordem:
    - [I_RESPONSAVEL, asc]
    - [RESPONSAVEL_TIPO, asc]
    colunas: {codigo_do_responsavel: I_RESPONSAVEL, responsavel_tipo: RESPONSAVEL_TIPO, empresa: CODI_EMP}
    vinculos:
      geempre:
        tabela: geempre
        liga: {codi_emp: codi_emp}
        colunas: {geempre_nome: nome_emp}
      usconfusuario:
        tabela: usConfUsuario
        liga: {responsavel_tipo: tipo, i_responsavel: i_confusuario}
        colunas: {usconfusuario_nome: NOME}
    filtros:
      codigo_do_responsavel:
        coluna: I_RESPONSAVEL
        ops: [eq, in]
      responsavel_tipo:
        coluna: RESPONSAVEL_TIPO
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 469 linhas, 468 empresa(s).', 'Vínculo geempre (geempre): 0 de 1 linhas sem registro relacionado (empresa 378).', 'Vínculo usconfusuario
        (usConfUsuario): 0 de 1 linhas sem registro relacionado (empresa 378).']
  pcmovimento_atividade:
    titulo: Movimentos atividades
    descricao: 'Movimentos atividades. 61 linhas no catálogo; chave: I_VINCULO, I_SEQUENCIAL_ATIVIDADE, I_SEQUENCIAL_MOVIMENTO.'
    tabela: PCMOVIMENTO_ATIVIDADE
    chave: [I_VINCULO, I_SEQUENCIAL_ATIVIDADE, I_SEQUENCIAL_MOVIMENTO]
    acesso: {empresa: null, periodo: DATA_INICIO, volume: pequeno}
    ordem:
    - [DATA_INICIO, desc]
    - [I_VINCULO, asc]
    - [I_SEQUENCIAL_ATIVIDADE, asc]
    colunas: {codigo_do_vinculo: I_VINCULO, sequencial_da_atividade: I_SEQUENCIAL_ATIVIDADE, sequencial: I_SEQUENCIAL_MOVIMENTO, data_de_inicio: DATA_INICIO, competencia_de_referencia: COMPETENCIA_REFERENCIA,
      data_de_vencimento_original: DATA_VENCIMENTO_ORIGINAL, data_de_vencimento: DATA_VENCIMENTO, data_de_vencimento_legal_original: DATA_VENCIMENTO_LEGAL_ORIGINAL,
      data_de_vencimento_legal: DATA_VENCIMENTO_LEGAL, concluida_s_n: CONCLUIDA, usuario_que_concluiu: USUARIO_CONCLUSAO, anotacao: ANOTACAO, data_do_vencimento_do_aviso: DATA_VENCIMENTO_AVISO,
      data_que_inicia_o_aviso: DATA_INICIO_AVISO, informar_neste_campo_se_o_movimento_foi: ALTERADO_INICIO_VENCIMENTO_UTILITARIO}
    filtros:
      codigo_do_vinculo:
        coluna: I_VINCULO
        ops: [eq, in]
      sequencial_da_atividade:
        coluna: I_SEQUENCIAL_ATIVIDADE
        ops: [eq, in]
      sequencial:
        coluna: I_SEQUENCIAL_MOVIMENTO
        ops: [eq, in]
      data_de_inicio:
        coluna: DATA_INICIO
        ops: [entre, gte, lte]
      competencia_de_referencia:
        coluna: COMPETENCIA_REFERENCIA
        ops: [entre, gte, lte]
      data_de_vencimento_original:
        coluna: DATA_VENCIMENTO_ORIGINAL
        ops: [entre, gte, lte]
      data_de_vencimento:
        coluna: DATA_VENCIMENTO
        ops: [entre, gte, lte]
      data_de_vencimento_legal_original:
        coluna: DATA_VENCIMENTO_LEGAL_ORIGINAL
        ops: [entre, gte, lte]
      data_de_vencimento_legal:
        coluna: DATA_VENCIMENTO_LEGAL
        ops: [entre, gte, lte]
      data_do_vencimento_do_aviso:
        coluna: DATA_VENCIMENTO_AVISO
        ops: [entre, gte, lte]
      data_que_inicia_o_aviso:
        coluna: DATA_INICIO_AVISO
        ops: [entre, gte, lte]
      concluida_s_n:
        coluna: CONCLUIDA
        ops: [eq, in]
      usuario_que_concluiu:
        coluna: USUARIO_CONCLUSAO
        ops: [contem, prefixo]
      anotacao:
        coluna: ANOTACAO
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 61 linhas, DATA_INICIO de 2018-01-26 a 2020-06-10.', 'Colunas expostas nulas em 100% das linhas (1): anotacao.']
  pcmovimento_atividade_responsavel:
    titulo: Movimentos atividades - Responsáveis
    descricao: 'Movimentos atividades - Responsáveis. 61 linhas no catálogo; chave: I_VINCULO, I_SEQUENCIAL_ATIVIDADE, I_SEQUENCIAL_MOVIMENTO, I_SEQUENCIAL_RESPONSAVEL.'
