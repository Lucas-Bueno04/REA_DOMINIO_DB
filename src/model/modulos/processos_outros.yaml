    - [I_SEQUENCIAL_ATIVIDADE, asc]
    colunas: {codigo_do_vinculo: I_VINCULO, sequencial_da_atividade: I_SEQUENCIAL_ATIVIDADE, sequencial_do_movimento: I_SEQUENCIAL_MOVIMENTO, sequencial_do_responsavel: I_SEQUENCIAL_RESPONSAVEL,
      codigo_do_responsavel: I_RESPONSAVEL, responsavel_tipo: RESPONSAVEL_TIPO}
    vinculos:
      usconfusuario:
        tabela: usConfUsuario
        liga: {responsavel_tipo: tipo, i_responsavel: i_confusuario}
        colunas: {usconfusuario_nome: NOME}
    filtros:
      codigo_do_vinculo:
        coluna: I_VINCULO
        ops: [eq, in]
      sequencial_da_atividade:
        coluna: I_SEQUENCIAL_ATIVIDADE
        ops: [eq, in]
      sequencial_do_movimento:
        coluna: I_SEQUENCIAL_MOVIMENTO
        ops: [eq, in]
      sequencial_do_responsavel:
        coluna: I_SEQUENCIAL_RESPONSAVEL
        ops: [eq, in]
      codigo_do_responsavel:
        coluna: I_RESPONSAVEL
        ops: [eq, in]
      responsavel_tipo:
        coluna: RESPONSAVEL_TIPO
        ops: [eq, in]
    regras: ['Medido em 2026-10-18: 61 linhas.', 'Vínculo usconfusuario (usConfUsuario): 0 de 61 linhas sem registro relacionado.']
