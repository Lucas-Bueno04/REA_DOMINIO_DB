  efcupom_fiscal_eletronico_estoque_apuracao_estoque:
    titulo: Cupom Fiscal Eletrônico - CF-e - Estoque - Apuração - Estoque
    descricao: 'Cupom Fiscal Eletrônico - CF-e - Estoque - Apuração - Estoque. 12.412.414 linhas no catálogo; chave: CODI_EMP, I_CFE, I_ESTOQUE.'
    tabela: EFCUPOM_FISCAL_ELETRONICO_ESTOQUE_APURACAO_ESTOQUE
    chave: [CODI_EMP, I_CFE, I_ESTOQUE]
    acesso:
      empresa: CODI_EMP
      periodo: DATA_MOVIMENTACAO
      exige_algum: [codigo_do_cf_e]
      volume: grande
    ordem:
    - [DATA_MOVIMENTACAO, desc]
    - [I_CFE, asc]
    - [I_ESTOQUE, asc]
