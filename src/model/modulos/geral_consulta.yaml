# Gerado em lote por scripts/mapear_lote.py a partir da ESTRUTURA do banco (comentários, PK, FK) e testado no banco real.
# Entidades sem `regras` ainda não foram conferidas contra dados; domínios extraídos de comentários são hipóteses até medir (medir_fatos.py).
modulo: geral_consulta
titulo: Geral - consulta (rascunho em lote)
entidades:
  geconsulta_web_service_portal_federal_catalogo:
    titulo: Consulta NF-e Webservice Portal Federal - Catálogo
    descricao: 'Consulta NF-e Webservice Portal Federal - Catálogo. 1.612 linhas no catálogo; chave: I_CATALOGO.'
    tabela: GECONSULTA_WEB_SERVICE_PORTAL_FEDERAL_CATALOGO
    chave: [I_CATALOGO]
    acesso: {empresa: null, periodo: DATA_EMISSAO, volume: pequeno}
    ordem:
    - [DATA_EMISSAO, desc]
    - [I_CATALOGO, asc]
    colunas:
      codigo_sequencial: I_CATALOGO
      cnpj_emitente: {coluna: CNPJ_EMITENTE, sensivel: parcial}
      cnpj_destinatario: {coluna: CNPJ_DESTINATARIO, sensivel: parcial}
      data_emissao: DATA_EMISSAO
      situacao_manifestacao: SITUACAO_MANIFESTACAO
      situacao_nota: SITUACAO_NOTA
      cstat_manifesto: CSTAT_MANIFESTO
      xmotivo_manifesto: XMOTIVO_MANIFESTO
      realizar_download: REALIZAR_DOWNLOAD
      cstat_download: CSTAT_DOWNLOAD
      xmotivo_download: XMOTIVO_DOWNLOAD
      data_download: DATA_DOWNLOAD
      enviou_box_e: ENVIOU_BOXE
      data_envio_ao_box_e: DATA_ENVIO
      quantidade_de_tentativas_da_manifestacao: QUANTIDADE_TENTATIVAS_MANIFESTACAO
      c_1_entrada_2_saida_4_servico: TIPO_NOTA
      nsu_da_nota: NSU_NOTA
      c_1_nf_e_2_ct_e_3_nfs_e: MODELO_NOTA
      quantidade_de_tentativas_de_envios_ao_bo: QUANTIDADE_TENTATIVAS_BOXE
      protocolo: PROTOCOLO_BOXE
      motivo: MOTIVO_BOXE
      chave_nota: CHAVE_NOTA
    filtros:
      codigo_sequencial:
        coluna: I_CATALOGO
        ops: [eq, in]
      data_emissao:
        coluna: DATA_EMISSAO
        ops: [entre, gte, lte]
      data_download:
        coluna: DATA_DOWNLOAD
        ops: [entre, gte, lte]
      data_envio_ao_box_e:
        coluna: DATA_ENVIO
        ops: [entre, gte, lte]
      cnpj_emitente:
        coluna: CNPJ_EMITENTE
        ops: [eq, in]
      cnpj_destinatario:
        coluna: CNPJ_DESTINATARIO
        ops: [eq, in]
      situacao_manifestacao:
        coluna: SITUACAO_MANIFESTACAO
        ops: [eq, in]
      situacao_nota:
        coluna: SITUACAO_NOTA
        ops: [eq, in]
      xmotivo_manifesto:
        coluna: XMOTIVO_MANIFESTO
        ops: [contem, prefixo]
      realizar_download:
        coluna: REALIZAR_DOWNLOAD
        ops: [eq, in]
      xmotivo_download:
        coluna: XMOTIVO_DOWNLOAD
        ops: [contem, prefixo]
      enviou_box_e:
        coluna: ENVIOU_BOXE
        ops: [eq, in]
      c_1_entrada_2_saida_4_servico:
        coluna: TIPO_NOTA
        ops: [eq, in]
      protocolo:
        coluna: PROTOCOLO_BOXE
        ops: [contem, prefixo]
    regras: ['Medido em 2026-10-18: 1.612 linhas, DATA_EMISSAO de 2017-05-17 a 2018-08-23.', 'Colunas expostas nulas em 100% das linhas (4): nsu_da_nota, quantidade_de_tentativas_de_envios_ao_bo,
