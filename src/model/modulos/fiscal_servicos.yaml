      codigo_do_beneficio_dirbi: CODIGO_BENEFICIO_DIRBI, calcular_reducao_linear_lc224: CALCULAR_REDUCAO_LINEAR_LC224}
    vinculos:
      eftabela_natureza_receit:
        tabela: EFTABELA_NATUREZA_RECEITA
        liga: {natureza_receita: codigo, cst: codigo_cst}
        colunas: {eftabela_natureza_receit_nome: DESCRICAO}
    filtros:
      codigo_do_servico:
        coluna: CODI_SER
        ops: [eq, in]
      sequencial:
        coluna: I_PIS_COFINS
        ops: [eq, in]
      codigo_sequencial_do_recolhimento_do_pis:
