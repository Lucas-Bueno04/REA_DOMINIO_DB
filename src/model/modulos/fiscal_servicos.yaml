      codigo_do_recolhimento_do_cofins:
        coluna: CODIGO_RECOLHIMENTO_COFINS
        ops: [eq, in]
      codigo_do_beneficio_dirbi:
        coluna: CODIGO_BENEFICIO_DIRBI
        ops: [eq, in]
      calcular_reducao_linear_lc224:
        coluna: CALCULAR_REDUCAO_LINEAR_LC224
        ops: [eq, in]
