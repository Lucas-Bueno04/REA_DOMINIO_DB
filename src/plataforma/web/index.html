<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapeamento do banco Domínio</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#fff; --ink:#18212b; --muted:#5c6b7a; --line:#d6dce3; --soft:#eceff3; --accent:#2a6fdb; --danger:#c0392b; --ok:#177a4d;
  --s-validada:#0e7a49; --s-modelada:#34a874; --s-apoio:#a4d9bd; --s-em_analise:#f2b632; --s-ignorada:#aeb6c1; --s-vazia:#e3e7ec;
  --s-nao_iniciada:#cf5b52; --s-bloqueada:#6c3483;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10151b; --panel:#192029; --ink:#e6ebf0; --muted:#95a3b2; --line:#2c3643; --soft:#222b36; --accent:#6aa3ff; --danger:#ff7a6b; --ok:#46c98b;
    --s-validada:#1aa468; --s-modelada:#3cc98a; --s-apoio:#2b6a4d; --s-em_analise:#e6a91f; --s-ignorada:#5d6772; --s-vazia:#262f3a;
    --s-nao_iniciada:#c9524a; --s-bloqueada:#a569bd}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:9px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:16px}
header .sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
button,.btn,select,input,textarea{font:inherit;color:var(--ink)}
button,.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on,button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pe{padding:3px 8px;font-size:12px}
button:disabled{opacity:.5;cursor:default}
input[type=search],input[type=text],select,textarea{border:1px solid var(--line);background:var(--panel);padding:6px 9px;border-radius:8px}
textarea{width:100%;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
main{padding:16px;max-width:1560px;margin:0 auto}
section{display:none}section.on{display:block}
h2{margin:4px 0 4px;font-size:18px} h3{margin:0 0 8px;font-size:14px} h4{margin:12px 0 6px;font-size:13px}
p.lead{color:var(--muted);margin:0 0 12px;max-width:90ch}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1.2fr 1fr}.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
@media (max-width:1000px){.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;box-shadow:var(--shadow)}
.card b{display:block;font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card span{color:var(--muted);font-size:12px}
.seg{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.seg i{display:block;height:100%;min-width:1px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin:8px 0 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.legend span.off{opacity:.35}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px}
.bar{height:9px;border-radius:5px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.small{font-size:12px;color:var(--muted)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;border:1px solid var(--line);background:var(--soft);color:var(--muted);margin:0 4px 3px 0}
.st{display:inline-block;border-radius:6px;padding:1px 8px;font-size:11.5px;color:#fff;white-space:nowrap}
.st.vazia{color:var(--ink)} .st.apoio{color:#0b3d27}
.depbloco{margin-bottom:18px}
.dephead{display:flex;gap:12px;align-items:baseline;margin:4px 0 6px}
.dephead b{font-size:14px}
canvas{display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
#tip{position:fixed;pointer-events:none;z-index:60;background:#111a;color:#fff;backdrop-filter:blur(4px);padding:7px 10px;border-radius:8px;font-size:12px;max-width:340px;display:none;box-shadow:var(--shadow)}
#tip b{display:block;margin-bottom:2px}
aside#gaveta{position:fixed;right:0;top:0;bottom:0;width:min(760px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.18);z-index:50;transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column}
aside#gaveta.on{transform:none}
#gaveta .topo{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#gaveta .abas{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line)}
#gaveta .abas button{border-radius:8px 8px 0 0;border-bottom:0}
#gaveta .corpo{padding:12px 14px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:140px 1fr;gap:3px 10px;margin:8px 0}.kv div:nth-child(odd){color:var(--muted)}
.res{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--soft)}
.res.ok{border-color:var(--ok)}.res.err{border-color:var(--danger)}
.pill{cursor:pointer}
.chart{width:100%;height:150px}
footer{color:var(--muted);font-size:12px;padding:8px 16px 28px;max-width:1560px;margin:0 auto}
</style>
</head>
<body>
<header>
  <div><h1>Mapeamento do banco Domínio</h1><div class="sub" id="sub">carregando…</div></div>
  <nav id="nav"></nav>
  <button id="atualizar" title="Recarregar os dados">Atualizar</button>
</header>
<main>
  <section id="s-painel"></section>
  <section id="s-mosaico"></section>
  <section id="s-fila"></section>
  <section id="s-familias"></section>
  <section id="s-historico"></section>
</main>
<div id="tip"></div>
<aside id="gaveta"><div class="topo"><div style="flex:1"><h3 id="gTitulo" style="margin:0"></h3><div class="small" id="gSub"></div></div><button id="gFechar">Fechar</button></div>
  <div class="abas" id="gAbas"></div><div class="corpo" id="gCorpo"></div></aside>
<footer>Plataforma local (127.0.0.1). O progresso é calculado a partir do catálogo, dos modelos YAML e da segurança; marcações manuais, notas e rascunhos ficam em data/progresso.db e data/rascunhos/.</footer>
<script>
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>n==null?'—':Number(n).toLocaleString('pt-BR');
const pct=(a,b)=>b?(100*a/b):0;
const pf=(a,b)=>pct(a,b).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
function h(tag,at,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(at||{})){if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const k of kids.flat())if(k!=null&&k!==false)e.append(k.nodeType?k:document.createTextNode(k));return e}
async function api(rota,corpo){
  const r=await fetch('/api/'+rota,corpo?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)}:{});
  const j=await r.json(); if(!r.ok) throw new Error(j.erro||('erro '+r.status)); return j;
}
const COR=s=>getComputedStyle(document.documentElement).getPropertyValue('--s-'+s).trim();
const S={resumo:null,serie:[],tabelas:[],fila:[],familias:[],hist:[],f:{dep:'',st:new Set(),q:'',min:0,fam:'',prior:false}};
const ORDEM=['validada','modelada','apoio','em_analise','nao_iniciada','ignorada','vazia','bloqueada'];

/* ---------- navegação */
const ABAS=[['painel','Painel'],['mosaico','Mosaico'],['fila','Fila de trabalho'],['familias','Famílias'],['historico','Histórico']];
function ir(id){document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('on',x.id==='s-'+id));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  if(id==='mosaico')desenharMosaico(); history.replaceState(null,'','#'+id)}
ABAS.forEach(([id,n])=>$('#nav').append(h('button',{'data-id':id,onclick:()=>ir(id)},n)));

/* ---------- carga */
async function carregar(){
  const [r,t,f,fa,hi]=await Promise.all([api('resumo'),api('tabelas'),api('fila?n=60'),api('familias'),api('historico?n=100')]);
  S.resumo=r.resumo;S.serie=r.serie;S.tabelas=t;S.fila=f;S.familias=fa;S.hist=hi;
  $('#sub').textContent=`${fmt(S.resumo.tabelas)} tabelas no escopo · ${fmt(S.resumo.tabelas_modeladas)} modeladas · atualizado ${S.resumo.gerado_em.replace('T',' ')}`;
  painel();mosaicoUI();filaUI();familiasUI();historicoUI();
  if($('#s-mosaico').classList.contains('on'))desenharMosaico();
}

/* ---------- painel */
function barraSeg(contagens,total,onclick){
  const b=h('div',{class:'seg'});
  ORDEM.forEach(s=>{const n=contagens[s]||0;if(!n)return;const i=h('i',{style:`width:${100*n/total}%;background:${COR(s)}`,title:`${S.resumo.rotulos[s]}: ${fmt(n)} (${pf(n,total)})`});if(onclick)i.addEventListener('click',()=>onclick(s));b.append(i)});return b}
function legenda(contagens,onclick){
  return h('div',{class:'legend'},ORDEM.filter(s=>contagens[s]).map(s=>h('span',{onclick:()=>onclick&&onclick(s)},h('i',{class:'sw',style:`background:${COR(s)}`}),`${S.resumo.rotulos[s]} · ${fmt(contagens[s])}`)))}
function meter(titulo,a,b,nota){
  return h('div',{style:'margin:10px 0'},h('div',{class:'row',style:'justify-content:space-between;margin:0 0 3px'},h('b',null,titulo),h('span',{class:'small'},`${fmt(a)} de ${fmt(b)} · ${pf(a,b)}`)),h('div',{class:'bar'},h('i',{style:`width:${Math.min(100,pct(a,b))}%`})),nota?h('div',{class:'small',style:'margin-top:2px'},nota):null)}
function painel(){
  const R=S.resumo,sec=$('#s-painel');sec.innerHTML='';
  const irMosaico=s=>{S.f.st=new Set([s]);ir('mosaico');mosaicoUI();desenharMosaico()};
  sec.append(h('h2',null,'Onde estamos'),h('p',{class:'lead'},`Cada tabela legível do banco (${fmt(R.tabelas)}) tem um status. Verde = já mapeada em uma entidade; vermelho = ainda não iniciada; cinza = vazia hoje ou ignorada. Clique em uma cor para ver essas tabelas no mosaico.`));
  sec.append(h('div',{class:'box'},barraSeg(R.por_status,R.tabelas,irMosaico),legenda(R.por_status,irMosaico)));
  sec.append(h('div',{class:'grid g4'},
    [[fmt(R.tabelas_modeladas),'tabelas modeladas ('+pf(R.tabelas_modeladas,R.tabelas)+' do total)'],[fmt(R.entidades),'entidades de negócio ('+R.entidades_validadas+' com regras validadas)'],
     [fmt(R.por_status.em_analise||0),'em análise agora'],[fmt(R.dominios_confirmados)+' / '+fmt(R.dominios),'domínios de códigos confirmados']].map(([n,t])=>h('div',{class:'card'},h('b',null,n),h('span',null,t)))));
  sec.append(h('div',{class:'grid g2',style:'margin-top:14px'},
    h('div',{class:'box'},h('h3',null,'Progresso por medida'),
      meter('Tabelas que valem mapear (≥ 1.000 linhas)',R.grandes_modeladas,R.grandes,'Meta realista: ignora as vazias e as pequenas.'),
      meter('Tabelas relevantes (não vazias, não ignoradas)',R.relevantes_modeladas,R.relevantes),
      meter('Linhas de dados cobertas',R.linhas_modeladas,R.linhas_total,'As poucas tabelas modeladas são justamente as de maior volume.'),
      meter('Colunas expostas / colunas úteis',R.colunas_expostas,R.colunas_uteis_total,'Úteis = sem as marcadas "SEM USO" pelo banco e sem credenciais.'),
      h('div',{class:'small',style:'margin-top:8px'},`Fora do escopo (não contam): ${fmt(R.fora_do_escopo.base_interna)} tabelas internas, ${fmt(R.fora_do_escopo.temporarias)} temporárias, ${fmt(R.fora_do_escopo.views)} views.`)),
    h('div',{class:'box'},h('h3',null,'Evolução (um ponto por dia de uso)'),grafico(),
      h('h4',null,'Próximas da fila'),h('table',null,h('tbody',null,S.fila.slice(0,6).map(x=>h('tr',null,h('td',{class:'mono'},x.nome),h('td',{class:'small'},x.motivo),h('td',null,h('button',{class:'pe',onclick:()=>abrir(x.nome)},'Abrir')))))))));
  const dep=h('div',{class:'box'},h('h3',null,'Por departamento'));
  Object.entries(R.por_departamento).sort((a,b)=>Object.values(b[1]).reduce((x,y)=>x+y,0)-Object.values(a[1]).reduce((x,y)=>x+y,0)).forEach(([d,c])=>{const tot=Object.values(c).reduce((x,y)=>x+y,0);
    dep.append(h('div',{style:'margin:8px 0'},h('div',{class:'row',style:'justify-content:space-between;margin:0 0 3px'},h('b',null,d),h('span',{class:'small'},`${fmt(tot)} tabelas · ${fmt((c.validada||0)+(c.modelada||0)+(c.apoio||0))} modeladas`)),barraSeg(c,tot,s=>{S.f.dep=d;irMosaico(s)})))});
  sec.append(dep);
}
function grafico(){
  const pts=S.serie;const W=520,H=150,p=28;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('class','chart');
  const mx=Math.max(1,...pts.map(x=>x.tabelas_modeladas))*1.15;
  const X=i=>pts.length===1?W/2:p+i*(W-2*p)/(pts.length-1),Y=v=>H-p-(v/mx)*(H-2*p);
  const e=(t,a,tx)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))n.setAttribute(k,v);if(tx!=null)n.textContent=tx;return n};
  svg.append(e('line',{x1:p,y1:H-p,x2:W-p,y2:H-p,stroke:'var(--line)'}));
  if(pts.length>1)svg.append(e('polyline',{fill:'none',stroke:'var(--accent)','stroke-width':2.4,points:pts.map((x,i)=>`${X(i)},${Y(x.tabelas_modeladas)}`).join(' ')}));
  pts.forEach((x,i)=>{svg.append(e('circle',{cx:X(i),cy:Y(x.tabelas_modeladas),r:4.5,fill:'var(--accent)'}),e('text',{x:X(i),y:Y(x.tabelas_modeladas)-9,'text-anchor':'middle','font-size':11,fill:'var(--ink)'},x.tabelas_modeladas),e('text',{x:X(i),y:H-9,'text-anchor':'middle','font-size':10,fill:'var(--muted)'},x.dia.slice(5)))});
  svg.append(e('text',{x:p,y:12,'font-size':11,fill:'var(--muted)'},'tabelas modeladas'));
  return svg}

/* ---------- mosaico */
function mosaicoUI(){
  const sec=$('#s-mosaico');sec.innerHTML='';
  const deps=[...new Set(S.tabelas.map(t=>t.dep))].sort();
  const busca=h('input',{type:'search',placeholder:'Buscar tabela…',value:S.f.q,oninput:e=>{S.f.q=e.target.value.trim().toLowerCase();desenharMosaico()}});
  const selDep=h('select',{onchange:e=>{S.f.dep=e.target.value;desenharMosaico()}},h('option',{value:''},'Todos os departamentos'),deps.map(d=>h('option',{value:d,selected:d===S.f.dep},d)));
  const selMin=h('select',{onchange:e=>{S.f.min=+e.target.value;desenharMosaico()}},[[0,'Qualquer tamanho'],[1,'≥ 1 linha'],[1000,'≥ 1.000 linhas'],[100000,'≥ 100 mil linhas'],[1000000,'≥ 1 milhão']].map(([v,t])=>h('option',{value:v,selected:v===S.f.min},t)));
  const prior=h('label',{class:'small'},h('input',{type:'checkbox',checked:S.f.prior,onchange:e=>{S.f.prior=e.target.checked;desenharMosaico()}}),' só priorizadas');
  const fam=S.f.fam?h('button',{class:'pe on',onclick:()=>{S.f.fam='';mosaicoUI();desenharMosaico()}},'família: '+S.f.fam+' ✕'):null;
  const leg=h('div',{class:'legend'},ORDEM.map(s=>h('span',{class:S.f.st.size&&!S.f.st.has(s)?'off':'',onclick:()=>{S.f.st.has(s)?S.f.st.delete(s):S.f.st.add(s);mosaicoUI();desenharMosaico()}},h('i',{class:'sw',style:`background:${COR(s)}`}),S.resumo.rotulos[s])),
    h('span',{onclick:()=>{S.f.st=new Set();mosaicoUI();desenharMosaico()}},'limpar filtro de status'),h('span',null,h('i',{class:'sw',style:'background:transparent;border:2px solid var(--accent)'}),'priorizada'));
  sec.append(h('h2',null,'Mosaico: uma célula por tabela'),h('p',{class:'lead'},'Agrupado por departamento e família de tabelas. Passe o mouse para ver a tabela; clique para abrir o detalhe, mapear colunas e gerar a entidade.'),
    h('div',{class:'row'},busca,selDep,selMin,prior,fam),leg,h('div',{id:'mosaico-corpo',style:'margin-top:12px'}));
}
function filtrado(){
  const f=S.f;return S.tabelas.filter(t=>(!f.dep||t.dep===f.dep)&&(!f.st.size||f.st.has(t.status))&&(!f.q||t.nome.toLowerCase().includes(f.q)||t.fam.toLowerCase().includes(f.q))&&t.linhas>=f.min&&(!f.fam||t.fam===f.fam)&&(!f.prior||t.prioridade))}
const HIT=[];
function desenharMosaico(){
  const corpo=$('#mosaico-corpo');if(!corpo||!$('#s-mosaico').classList.contains('on'))return;corpo.innerHTML='';HIT.length=0;
  const lista=filtrado();$('#s-mosaico .lead').dataset.n=lista.length;
  const porDep=new Map();lista.forEach(t=>{if(!porDep.has(t.dep))porDep.set(t.dep,[]);porDep.get(t.dep).push(t)});
  const deps=[...porDep.entries()].sort((a,b)=>b[1].length-a[1].length);
  const W=corpo.clientWidth||1100,C=12,G=2;
  const dpr=window.devicePixelRatio||1;
  corpo.append(h('div',{class:'small',style:'margin-bottom:8px'},`${fmt(lista.length)} tabelas exibidas`));
  deps.forEach(([dep,ts])=>{
    const fams=new Map();ts.sort((a,b)=>a.fam.localeCompare(b.fam)||b.linhas-a.linhas).forEach(t=>{if(!fams.has(t.fam))fams.set(t.fam,[]);fams.get(t.fam).push(t)});
    const LH=13,PAD=14;let x0=6,y=6,rowH=0;const lay=[];
    fams.forEach((arr,fam)=>{const k=Math.min(arr.length,16),w=Math.max(k*(C+G),118),rows=Math.ceil(arr.length/k),hh=LH+rows*(C+G);
      if(x0+w>W-6&&x0>6){x0=6;y+=rowH+PAD;rowH=0}
      lay.push({fam,arr,x:x0,y,k,rows,w});x0+=w+PAD;rowH=Math.max(rowH,hh)});
    y+=rowH+6;
    const mod=ts.filter(t=>['validada','modelada','apoio'].includes(t.status)).length;
    const cv=h('canvas');cv.width=W*dpr;cv.height=y*dpr;cv.style.height=y+'px';const g=cv.getContext('2d');g.scale(dpr,dpr);
    g.font='10.5px system-ui';const txt=getComputedStyle(document.documentElement).getPropertyValue('--muted');
    const meta=[];
    lay.forEach(L=>{g.fillStyle=txt;g.textBaseline='top';const lb=L.fam+' · '+L.arr.length;g.fillText(lb.length>(L.w/6)?lb.slice(0,Math.floor(L.w/6)-1)+'…':lb,L.x,L.y);
      L.arr.forEach((t,i)=>{const x=L.x+(i%L.k)*(C+G),yy=L.y+13+Math.floor(i/L.k)*(C+G);g.fillStyle=COR(t.status);g.fillRect(x,yy,C,C);
        if(t.prioridade){g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent');g.lineWidth=2;g.strokeRect(x-.5,yy-.5,C+1,C+1)}
        if(t.nota){g.fillStyle='#fff';g.fillRect(x+C-4,yy+1,3,3)}});
      meta.push(L)});
    cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*(W/r.width),yv=e.clientY-r.top;const t=achar(meta,x,yv,C,G);
      const tip=$('#tip');if(t){tip.style.display='block';tip.style.left=Math.min(innerWidth-360,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';
        tip.innerHTML=`<b>${t.nome}</b>${t.fam} · ${fmt(t.linhas)} linhas<br>${S.resumo.rotulos[t.status]}${t.programas?` · ${t.programas} programas`:''}`;cv.style.cursor='pointer'}else{tip.style.display='none';cv.style.cursor='default'}});
