<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa do banco Domínio</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b2430; --muted:#5d6b7a; --line:#d7dce3; --soft:#eef1f5; --accent:#2a6fdb;
  --fiscal:#2a6fdb; --contabil:#1f9d6b; --folha:#d9822b; --honorarios:#8a4fd3; --geral:#5b6b7a; --comum:#c0455b;
  --edge:#8794a3; --edge-hi:#e0431f; --shadow:0 1px 2px rgba(20,30,50,.08),0 4px 14px rgba(20,30,50,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161c; --panel:#1b222b; --ink:#e7ebf0; --muted:#98a5b3; --line:#2f3946; --soft:#232c37; --accent:#6aa3ff;
    --fiscal:#6aa3ff; --contabil:#3ccf94; --folha:#f0a24d; --honorarios:#b58cf0; --geral:#9aa9b9; --comum:#ee7a90; --edge:#6f7e8e; --edge-hi:#ff7a55}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650}
header .sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button,.chip,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover,nav button:hover,.chip:hover{border-color:var(--accent)}
main{padding:16px;max-width:1500px;margin:0 auto}
section{display:none}
section.on{display:block}
h2{font-size:18px;margin:6px 0 4px}
p.lead{color:var(--muted);margin:0 0 14px;max-width:80ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin:12px 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow)}
.card b{display:block;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card span{color:var(--muted);font-size:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px}
.box h3{margin:0 0 8px;font-size:14px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
code,.mono{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12.5px}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.row2{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 10px}
input[type=search],select{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 10px;border-radius:8px;font:inherit;min-width:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
.legend i{display:inline-block;width:26px;height:0;border-top:2px solid var(--edge);vertical-align:middle;margin-right:5px}
.legend i.d{border-top-style:dashed}
.legend i.o{border-top-color:var(--accent)}
#canvasWrap{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:calc(100vh - 250px);min-height:460px;overflow:hidden;box-shadow:var(--shadow)}
#canvasWrap svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#canvasWrap svg.drag{cursor:grabbing}
.zoom{position:absolute;right:10px;top:10px;display:flex;gap:4px;z-index:5}
.zoom .btn{padding:4px 10px}
.node rect.cab{stroke-width:0}
.node .corpo{fill:var(--panel);stroke:var(--line)}
.node text{font-size:11.5px;fill:var(--ink)}
.node text.t{font-weight:650;fill:#fff;font-size:12px}
.node text.m{fill:var(--muted)}
.node text.pk{font-weight:600}
.node{cursor:pointer}
.node.dim{opacity:.18}
.node.sel .corpo{stroke:var(--edge-hi);stroke-width:2}
.node:hover .corpo{stroke:var(--accent);stroke-width:1.6}
.edge{fill:none;stroke:var(--edge);stroke-width:1.2}
.edge.t-vigencia{stroke:#b07a2a}
.edge.t-ligacao{stroke:#8a8f99}
.edge.obs{stroke-dasharray:5 4}
.edge.dim{opacity:.07}
.edge.hi{stroke:var(--edge-hi);stroke-width:2.2;opacity:1}
aside#painel{position:fixed;right:0;top:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.16);z-index:40;transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column}
aside#painel.on{transform:none}
aside#painel .topo{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
aside#painel .topo h3{margin:0;font-size:15px}
aside#painel .conteudo{padding:12px 14px;overflow:auto;flex:1}
aside#painel .x{margin-left:auto}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;border:1px solid var(--line);background:var(--soft);color:var(--muted);margin:0 4px 3px 0}
.tag.m{color:#fff;border:0}
.lock{filter:saturate(0)}
.regra{border-left:3px solid var(--accent);padding:3px 0 3px 10px;margin:6px 0;color:var(--ink)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 10px;margin:8px 0}
.kv div:nth-child(odd){color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.fn td:first-child{white-space:nowrap}
details.arq{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
details.arq>summary{cursor:pointer;padding:9px 12px;list-style:none;display:flex;gap:10px;align-items:baseline}
details.arq>summary::-webkit-details-marker{display:none}
details.arq[open]>summary{border-bottom:1px solid var(--line)}
details.arq .corpo{padding:4px 12px 10px}
footer{color:var(--muted);font-size:12px;padding:8px 16px 24px;max-width:1500px;margin:0 auto}
</style>
</head>

function layout(M){

  const by = {}; T.forEach(t => by[t.id]=t);
  const E = M.relacoes.map(e => Object.assign({}, e, {f:e.filha.toLowerCase(), p:e.pai.toLowerCase()})).filter(e => by[e.f] && by[e.p] && e.f!==e.p);

  const temNivel = T.every(t => typeof t.nivel === 'number');
  T.forEach(t => { if (!temNivel) t.nivel=0; const npk = Math.min(t.pk.length,4)+(t.pk.length>4?1:0), nfk = Math.min(t.fks.length,4); t.linhasBox = npk + nfk; t.h = HH + RH*Math.max(1,t.linhasBox) + 8; });
  if (!temNivel) for (let it=0; it<10; it++){ let ch=false; for (const e of E){ const a=by[e.p], b=by[e.f]; if (b.nivel < a.nivel+1 && a.nivel+1<=7){ b.nivel=a.nivel+1; ch=true; } } if(!ch) break; }
  const niveis = []; T.forEach(t => (niveis[t.nivel] = niveis[t.nivel]||[]).push(t));

  lv.forEach(l => l.sort((a,b) => (b.entidades.length - a.entidades.length) || a.nome.localeCompare(b.nome)));
  const idx = {}; const reidx = () => lv.forEach(l => l.forEach((t,i) => idx[t.id]=i));
  reidx();
  for (let sweep=0; sweep<3; sweep++){
    for (let i=1;i<lv.length;i++){ lv[i].forEach(t => { const ps = E.filter(e=>e.f===t.id && by[e.p].nivel<t.nivel).map(e=>idx[e.p]); t._b = ps.length? ps.reduce((x,y)=>x+y,0)/ps.length : 1e9; }); lv[i].sort((a,b)=>a._b-b._b); reidx(); }
    for (let i=lv.length-2;i>=0;i--){ lv[i].forEach(t => { const cs = E.filter(e=>e.p===t.id && by[e.f].nivel>t.nivel).map(e=>idx[e.f]); t._b = cs.length? cs.reduce((x,y)=>x+y,0)/cs.length : 1e9; }); lv[i].sort((a,b)=>a._b-b._b); reidx(); }
  }
  const alturas = lv.map(l => l.reduce((a,t)=>a+t.h+GY,0)-GY), maxH = Math.max(...alturas);
  lv.forEach((l,i) => { let y = (maxH-alturas[i])/2; l.forEach(t => { t.x = i*(W+GX); t.y = y; t.w = W; y += t.h+GY; }); });
  return {T, E, by, W, HH, RH, largura: lv.length*(W+GX)-GX, altura: maxH};
}

}
